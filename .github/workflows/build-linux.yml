name: Lint, test, and build Linux binaries

# Lints and tests the mod, then builds the Linux archives.
#
# Artifacts:
#
#   dist/AdGuardHome_linux_amd64.tar.gz  — x86_64
#   dist/AdGuardHome_linux_arm64.tar.gz  — arm64
#
# Run it manually from the Actions tab, push a tag such as v2026-09-23 to also
# publish a GitHub release with the archives attached, or open a pull request
# against the default branch to get the archives as build artifacts.  See
# scripts/make/version.sh for the version format.
#
# NOTE: The frontend is embedded into the Go binary, so it is built first.
# The next-generation SolidJS interface (client_v2/) is built from v1.0.0-b.1
# on; it keeps talking to the classic /control API.

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  # Pull requests are checked and built as well, so that a branch can be tested
  # on a device without building it locally.  The release steps below only run
  # for tags, so nothing is published from a pull request.
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

# Publishing a release requires a writable GITHUB_TOKEN.
permissions:
  contents: write

# Cancel the builds of a branch as soon as a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'development' }}
  CLIENT_DIR: client_v2
  DIST_DIR: dist
  # The official Go module proxy is tried first, and the mainland-China mirror
  # is used as a fallback.
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct
  # Uncomment the line below to use a mainland-China npm mirror.
  # NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  # There is no GPG key in this repository, so the builds are not signed.
  SIGN: '0'

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Install the frontend dependencies
        run: make js-deps

      - name: Lint the frontend
        run: make js-lint

      - name: Typecheck the frontend
        run: make js-typecheck

      - name: Test the frontend
        run: make js-test

      - name: Check the backend for the Linux architectures
        run: make go-deps go-os-check

      - name: Check the module files
        run: |
          #!/bin/sh

          set -e -f -u

          # Fail if go.mod or go.sum are not tidy.
          go mod tidy
          git --no-pager diff --exit-code go.mod go.sum

      - name: Test the backend
        run: go test ./...

  build-linux:
    name: Linux amd64 and arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The version script needs all the branches and tags.
          fetch-depth: 0
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Set the build version
        id: version
        run: |
          #!/bin/sh

          set -e -f -u

          source_date_epoch="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=${source_date_epoch}" >> "$GITHUB_ENV"

          app_version="$(env CHANNEL="${CHANNEL}" sh ./scripts/make/version.sh)"
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "version=${app_version}" >> "$GITHUB_OUTPUT"

          # A version with a suffix, for example v2026-09-23-beta, is published
          # as a pre-release and never becomes the latest release.
          case "${app_version}" in
          v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
            prerelease='false'
            ;;
          *)
            prerelease='true'
            ;;
          esac
          echo "PRERELEASE=${prerelease}" >> "$GITHUB_ENV"

          printf 'Building version %s (channel %s, prerelease %s)\n' \
            "${app_version}" "${CHANNEL}" "${prerelease}"

      - name: Install the frontend dependencies
        run: make js-deps

      - name: Build the frontend
        run: make js-build VERBOSE=1

      - name: Build the binaries
        run: |
          #!/bin/sh

          set -e -f -u

          make \
            ARCH="amd64 arm64" \
            CHANNEL="${CHANNEL}" \
            FRONTEND_PREBUILT=1 \
            OS="linux" \
            SIGN=0 \
            VERBOSE=1 \
            VERSION="${APP_VERSION}" \
            build-release \
            ;

      - name: Pack the release archives
        run: |
          #!/bin/sh

          set -e -f -u

          make \
            ARCH="amd64 arm64" \
            CHANNEL="${CHANNEL}" \
            OS="linux" \
            SHELL=/bin/bash \
            SIGN=0 \
            VERBOSE=1 \
            VERSION="${APP_VERSION}" \
            pack-release \
            ;

      # The template is what users compare their own configuration against, so
      # make sure the binary still accepts it.
      - name: Check the example configuration
        run: |
          #!/bin/sh

          set -e -f -u

          mkdir -p /tmp/agh-conf-check
          cp ./doc/AdGuardHome.yaml.example /tmp/agh-conf-check/AdGuardHome.yaml

          "./${DIST_DIR}/AdGuardHome_linux_amd64/AdGuardHome/AdGuardHome" \
            --check-config -w /tmp/agh-conf-check

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdGuardHome-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/checksums.txt
            dist/AdGuardHome_linux_amd64.tar.gz
            dist/AdGuardHome_linux_arm64.tar.gz

      # The releases carry the arm64 build only, since that is what the Magisk
      # module and the phones use.  The amd64 build stays in the artifacts
      # above, for local testing.  Keep the published checksums in sync with
      # the published files.
      - name: Keep the released checksums in sync
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          #!/bin/sh

          set -e -f -u

          grep 'AdGuardHome_linux_arm64\.tar\.gz$' dist/checksums.txt > dist/checksums.arm64.txt
          mv dist/checksums.arm64.txt dist/checksums.txt

          cat dist/checksums.txt

      # The running binaries read this file to find out about new versions, so
      # it must point at the release being published right now.  It is committed
      # to the default branch, because that is the URL the mod is built with,
      # see updater.DefaultVersionURL.
      - name: Update the version announcement file
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/bin/sh

          set -e -f -u

          tag="${GITHUB_REF_NAME}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/AdGuardHome_linux_arm64.tar.gz"

          cat >version.json <<JSON
          {
            "version": "${tag}",
            "announcement": "AdGuard Home Mod ${tag} 已发布。",
            "announcement_url": "${release_url}",
            "download_linux_arm64": "${archive_url}"
          }
          JSON

          # Fail here rather than publishing a file the binaries cannot use.
          grep -q 'download_linux_arm64' version.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"
          git add version.json
          git commit -m "Update version.json to ${tag}"
          git push origin "${DEFAULT_BRANCH}"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/checksums.txt
            dist/AdGuardHome_linux_arm64.tar.gz
          generate_release_notes: true
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          name: AdGuard Home Mod ${{ env.APP_VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body: |
            这是 AdGuard Home 的修改版（Mod）。

            tag 带 `-beta`、`-rc.1` 这类后缀时是**预发布**，供测试使用，不会抢占「最新版本」。

            发版只提供 Linux arm64 的发布包，解压后替换可执行文件即可。amd64 只用于本地测试，不随发版提供，需要的话到 Actions 页面下载 `AdGuardHome-linux` 产物。

            - `AdGuardHome_linux_arm64.tar.gz` — arm64
            - `checksums.txt` — 压缩包的 SHA-256 校验和

            解压与校验：

            ```sh
            tar -xzf AdGuardHome_linux_arm64.tar.gz
            sha256sum -c --ignore-missing checksums.txt
            ```

            主要为 Adguard-Home-For-Magisk-Mod 适配。改动内容、构建方式与上游同步方法见仓库首页的 README。
